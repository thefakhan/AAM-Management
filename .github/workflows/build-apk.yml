name: Build AAM Health Management APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract V5 project
        run: |
          ZIP=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: V5 ZIP not found"
            exit 1
          fi

          rm -rf app build.gradle settings.gradle gradle.properties
          mkdir -p project

          unzip -q "$ZIP" -d project

          ROOT=$(find project -type d -name app | head -n 1)

          if [ -z "$ROOT" ]; then
            echo "ERROR: app folder not found inside ZIP"
            exit 1
          fi

          PROJECT_ROOT=$(dirname "$ROOT")

          cp -rf "$PROJECT_ROOT"/. .

          echo "Using project:"
          pwd
          find app -maxdepth 8 -type f | sort

      - name: Verify V5 HTML
        run: |
          test -f app/src/main/assets/index.html
          echo "V5 index.html found"
          grep -q "AAM Health Management" app/src/main/assets/index.html
          echo "V5 HTML verified"

      - name: Build APK
        run: |
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AAM-Health-Management-V5-APK
          path: app/build/outputs/apk/debug/app-debug.apk
