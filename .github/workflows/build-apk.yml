name: Build AAM Health Management APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find and extract V5 ZIP
        shell: bash
        run: |
          ZIP=$(find . -maxdepth 1 -type f -name "AAM_Health_Management_V5*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: V5 ZIP not found in repository root."
            exit 1
          fi

          echo "Using: $ZIP"

          rm -rf extracted
          mkdir extracted

          unzip -q "$ZIP" -d extracted

          APP_DIR=$(find extracted -type d -path "*/app" | head -n 1)

          if [ -z "$APP_DIR" ]; then
            echo "ERROR: app folder not found inside V5 ZIP."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$APP_DIR")

          cp -rf "$PROJECT_DIR"/. .

          echo "Project extracted successfully."

      - name: Fix Java and Kotlin JVM target
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle")
          text = p.read_text()

          if "compileOptions" not in text:
              text = text.replace(
                  "android {",
                  """android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }"""
              )

          p.write_text(text)
          PY

      - name: Verify project
        run: |
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/assets/index.html

          echo "Project verification successful."

      - name: Build APK
        run: |
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AAM-Health-Management-V5-APK
          path: app/build/outputs/apk/debug/app-debug.apk
