name: Build KanchanCare APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract KanchanCare V5
        run: |
          set -e

          ZIP="KanchanCare_V5_FINAL.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: $ZIP not found in repository root."
            echo "Files in repository:"
            ls -la
            exit 1
          fi

          rm -rf extracted
          mkdir extracted

          unzip -q "$ZIP" -d extracted

          APP_DIR=$(find extracted -type d -path "*/app" | head -n 1)

          if [ -z "$APP_DIR" ]; then
            echo "ERROR: app folder not found inside ZIP."
            find extracted -maxdepth 5 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$APP_DIR")

          cp -rf "$PROJECT_DIR"/. .

          echo "KanchanCare V5 project extracted."

      - name: Verify V5 files
        run: |
          set -e

          echo "Checking required files..."

          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/assets/index.html

          echo "Checking logo files..."

          find app/src/main -type f | sort

          echo "V5 files verified successfully."

      - name: Force Java 17 compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle")
          text = p.read_text()

          if "compileOptions" not in text:
              text = text.replace(
                  "android {",
                  """android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }"""
              )

          p.write_text(text)
          print(p.read_text())
          PY

      - name: Build KanchanCare APK
        run: |
          gradle assembleDebug --no-daemon

      - name: Upload KanchanCare APK
        uses: actions/upload-artifact@v4
        with:
          name: KanchanCare-V5-APK
          path: app/build/outputs/apk/debug/app-debug.apk
